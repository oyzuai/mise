name: Oyzu embedding boundary

on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'examples/oyzu-embedding-check.rs'
      - 'examples/oyzu-embedding-check/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/oyzu-embedding.yml'
      - 'tooling/compliance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Library boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install compiler
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: oyzu-embedding-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: oyzu-embedding-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check embedding formatting
        run: rustfmt +1.95.0 --check --edition 2024 --config skip_children=true src/embedding.rs src/plugins/core/mod.rs src/plugins/core/node.rs src/plugins/core/node/embedding.rs src/plugins/core/embedding_selection.rs src/plugins/core/go.rs src/plugins/core/go/embedding.rs crates/mise-util/src/embedding.rs crates/mise-util/src/hash.rs crates/mise-util/src/http.rs src/plugins/core/java.rs src/plugins/core/python.rs examples/oyzu-embedding-check.rs examples/oyzu-embedding-check/go_replay.rs examples/oyzu-embedding-check/java_replay.rs examples/oyzu-embedding-check/python_catalog.rs
      - name: Check shared metadata utility library
        run: cargo +1.95.0 clippy --locked -p mise-util --lib --no-default-features --features rustls -- -D warnings
      - name: Check bounded metadata response collection
        run: cargo +1.95.0 test --locked -p mise-util --lib --no-default-features --features rustls metadata_bounds_tests
      - name: Check bounded Python catalog decoding
        run: cargo +1.95.0 test --locked --lib --no-default-features --features rustls,vfox/vendored-lua python_catalog_
      - name: Check library and conformance target
        run: cargo +1.95.0 clippy --locked --lib --example oyzu-embedding-check --no-default-features --features rustls,vfox/vendored-lua -- -D warnings
      - name: Run fresh-process boundary and real backend parser checks
        id: boundary_checks
        run: cargo +1.95.0 run --locked --example oyzu-embedding-check --no-default-features --features rustls,vfox/vendored-lua
      - name: Capture real Go qualification metadata
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request

          revision = "f35c01d5bc8348b4ee6efee8e52c5352e0003dfd"
          url = f"https://raw.githubusercontent.com/micahlmartin/oyzu/{revision}/tooling/mise-upstream/capture_go_metadata.py"
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(65537)
          if len(source) > 65536 or hashlib.sha256(source).hexdigest() != "159f0213c465379b2100a4b1c2b074f05aad6db3a6ea221ddcc79e103b3e8c2c":
              raise RuntimeError("pinned Go fixture provisioner hash mismatch")
          output = Path(os.environ["RUNNER_TEMP"]) / "go-metadata-fixture.json"
          with tempfile.TemporaryDirectory() as temporary:
              script = Path(temporary) / "tooling/mise-upstream/capture_go_metadata.py"
              script.parent.mkdir(parents=True)
              script.write_bytes(source)
              with (output.parent / "go-metadata-capture-report.json").open("w", encoding="utf-8") as report:
                  subprocess.run([sys.executable, str(script), "--version", "1.24.13",
                                  "--version", "1.25.0", "--output", str(output)],
                                 check=True, stdout=report)
      - name: Replay real Go metadata through the library
        env:
          OYZU_GO_METADATA_FIXTURE: ${{ runner.temp }}/go-metadata-fixture.json
        run: cargo +1.95.0 run --locked --example oyzu-embedding-check --no-default-features --features rustls,vfox/vendored-lua
      - name: Capture real Python qualification metadata
        id: python_capture
        if: ${{ !cancelled() && steps.boundary_checks.outcome == 'success' }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request

          revision = "e4993135fb966ab918c78932249e4d6188e05c13"
          url = f"https://raw.githubusercontent.com/micahlmartin/oyzu/{revision}/tooling/mise-upstream/capture_python_metadata.py"
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(65537)
          if len(source) > 65536 or hashlib.sha256(source).hexdigest() != "f9a867c1d1b80eacf1b8737300641ec32be5da52fea97f4b1bfa2d794bc89365":
              raise RuntimeError("pinned Python fixture provisioner hash mismatch")
          output = Path(os.environ["RUNNER_TEMP"]) / "python-metadata-fixture.json"
          with tempfile.TemporaryDirectory() as temporary:
              script = Path(temporary) / "tooling/mise-upstream/capture_python_metadata.py"
              script.parent.mkdir(parents=True)
              script.write_bytes(source)
              with (output.parent / "python-metadata-capture-report.json").open("w", encoding="utf-8") as report:
                  subprocess.run([sys.executable, str(script), "--output", str(output)], check=True, stdout=report)
      - name: Replay real Python catalogs through library selection
        if: ${{ !cancelled() && steps.python_capture.outcome == 'success' }}
        env:
          OYZU_PYTHON_METADATA_FIXTURE: ${{ runner.temp }}/python-metadata-fixture.json
        run: cargo +1.95.0 test --locked --lib --no-default-features --features rustls,vfox/vendored-lua python_catalog_captured_replay -- --ignored
      - name: Preserve real Python metadata evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-metadata-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/python-metadata-fixture.json
            ${{ runner.temp }}/python-metadata-capture-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Capture real Java qualification metadata
        id: java_capture
        if: ${{ !cancelled() && steps.boundary_checks.outcome == 'success' }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request

          revision = "373cfd383b05ea03145524f56b7d3b97c5d503ff"
          url = f"https://raw.githubusercontent.com/micahlmartin/oyzu/{revision}/tooling/mise-upstream/capture_java_metadata.py"
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(65537)
          if len(source) > 65536 or hashlib.sha256(source).hexdigest() != "bcdcb656d463f5c7ac25a25bb55243edfdcb474768a88d337fafd294d5a73fdc":
              raise RuntimeError("pinned Java fixture provisioner hash mismatch")
          output = Path(os.environ["RUNNER_TEMP"]) / "java-metadata-fixture.json"
          with tempfile.TemporaryDirectory() as temporary:
              script = Path(temporary) / "tooling/mise-upstream/capture_java_metadata.py"
              script.parent.mkdir(parents=True)
              script.write_bytes(source)
              with (output.parent / "java-metadata-capture-report.json").open("w", encoding="utf-8") as report:
                  subprocess.run([sys.executable, str(script), "--output", str(output)], check=True, stdout=report)
      - name: Replay real Java metadata through the library
        if: ${{ !cancelled() && steps.java_capture.outcome == 'success' }}
        env:
          OYZU_JAVA_METADATA_FIXTURE: ${{ runner.temp }}/java-metadata-fixture.json
        run: cargo +1.95.0 run --locked --example oyzu-embedding-check --no-default-features --features rustls,vfox/vendored-lua
      - name: Preserve real Java metadata evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-metadata-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/java-metadata-fixture.json
            ${{ runner.temp }}/java-metadata-capture-report.json
      - name: Preserve real Go metadata evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-metadata-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-metadata-fixture.json
            ${{ runner.temp }}/go-metadata-capture-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Provision locked metadata inputs for target review
        run: cargo +1.95.0 metadata --locked --format-version 1 --filter-platform ${{ matrix.target }} --no-default-features --features rustls,vfox/vendored-lua > metadata-provision.json
      - name: Collect unreviewed target dependency and notice evidence
        run: python tooling/compliance/cargo_graph.py --target ${{ matrix.target }} --output cargo-evidence.json --notice-bundle cargo-notices.zip
      - name: Preserve candidate review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-evidence-${{ matrix.target }}-${{ github.sha }}
          path: |
            cargo-evidence.json
            cargo-notices.zip
          if-no-files-found: error
          retention-days: 30
